<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Monitor ESP32</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#121212;
    color:white;
    display:flex;
    height: 100vh; /* Mantém a altura fixa da janela */
    overflow: hidden; /* Evita rolagem na página inteira, controlamos o scroll interno */
}

/*==================================================*/
/* SIDEBAR */
/*==================================================*/

.sidebar{
    width:260px;
    background:#1d1d1d;
    border-right:2px solid #333;
    padding:20px;
    overflow-y:auto;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    flex-shrink: 0;
}

.sidebar-topo {
    width: 100%;
}

.sidebar h2{
    margin-bottom:20px;
}

#arquivos{
    margin-bottom:20px;
}

.file{
    background:#292929;
    margin-bottom:10px;
    padding:10px;
    border-radius:8px;
    transition:.2s;
    border-left:4px solid #4CAF50;
}

.file:hover{
    background:#353535;
    transform:translateX(4px);
}

.file a{
    color:white;
    text-decoration:none;
}

.sidebar button{
    width:100%;
}

/*==================================================*/
/* MAIN */
/*==================================================*/

.main{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:20px;
    height: 100%;
    overflow: hidden; /* Mantém o grid interno rígido de acordo com a janela */
}

/*==================================================*/
/* TOPO */
/*==================================================*/

.topo{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-shrink: 0;
}

.titulo h1{
    margin-bottom:8px;
}

/*==================================================*/
/* STATUS */
/*==================================================*/

.statusLinha{
    display:flex;
    gap:18px;
    margin-top:5px;
    margin-bottom:15px;
}

.status{
    font-weight:bold;
}

.online{
    color:#4CAF50;
}

.offline{
    color:#ff4444;
}

.rec{
    color:#ff3333;
    animation:piscar 1s infinite;
}

@keyframes piscar{
    50%{
        opacity:.25;
    }
}

/*==================================================*/
/* INFO SUPERIOR */
/*==================================================*/

.infoSuperior{
    text-align:right;
    line-height:1.6;
    font-size:15px;
}

#fpContainer {
    font-weight: bold;
    color: #ff9900;
}

/*==================================================*/
/* VALORES */
/*==================================================*/

#valores{
    font-size:20px;
    font-weight:bold;
}

/*==================================================*/
/* CONTROLES */
/*==================================================*/

.controles{
    display:flex;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
    margin-top:15px;
    margin-bottom:15px;
    flex-shrink: 0;
}

button{
    border:none;
    border-radius:8px;
    padding:12px 18px;
    cursor:pointer;
    font-weight:bold;
    transition:.2s;
}

button:hover{
    transform:scale(1.03);
}

.start{
    background:#4CAF50;
    color:white;
}

.stop{
    background:#E53935;
    color:white;
}

.format{
    background:#FF9800;
    color:white;
}

.clear{
    background:#666;
    color:white;
}

select{
    background:#2d2d2d;
    color:white;
    border:1px solid #555;
    border-radius:6px;
    padding:8px;
}

/*==================================================*/
/* ÁREA DOS GRÁFICOS */
/*==================================================*/

#graficos {
    flex: 1;
    display: flex;         
    flex-direction: column;
    width: 100%;
    position: relative;
    overflow: hidden;      
    min-height: 0;         /* Essencial para impedir que o flexbox estique descontroladamente */
    box-sizing: border-box;
}

/* Classe base para todos os wrappers de modos */
.modo-wrapper {
    display: none;         
    width: 100%;
    height: 100%;
    max-height: 100%;
    min-height: 0;         
    box-sizing: border-box;
}

/* Container individual de cada canvas para o Chart.js */
.chart-container {
    position: relative;
    width: 100%;
    height: 100%;
    background: white;
    border-radius: 10px;
    padding: 10px;
    min-height: 0;         
    overflow: hidden;      
    box-sizing: border-box;
}

.chart-container canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
}

/* MODO 1 */
#modo1 {
    width: 100%;
    height: 100%;
}

/* MODO 2 (4 Linhas empilhadas) */
#modo2 {
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: repeat(4, minmax(0, 1fr));
    gap: 12px;
}

/* MODO 3 (2x2) */
#modo3 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

/* MODO 4 (4 colunas lado a lado) */
#modo4 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: 1fr;
    gap: 12px;
}

/* Ajuste específico para telas menores */
@media (max-width: 900px) {
    .main {
        overflow-y: auto;
    }
    #graficos {
        overflow: visible;
        height: auto;
        max-height: none;
    }
    .modo-wrapper {
        height: auto;
        max-height: none;
    }
    #modo2, #modo3, #modo4 {
        grid-template-columns: 1fr !important;
        grid-template-rows: repeat(4, 260px) !important;
    }
}

/*==================================================*/
/* BOTÃO HAMBÚRGUER E PAINEL FLUTUANTE DE CONFIGS */
/*==================================================*/

.btn-config {
    background: #2d2d2d;
    color: white;
    font-size: 24px;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid #444;
    transition: 0.2s;
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
}

.btn-config:hover {
    background: #444;
    transform: scale(1.05);
}

.painel-config {
    position: fixed;
    top: 0;
    right: -350px; 
    width: 350px;
    height: 100vh;
    background: #1a1a1a;
    border-left: 2px solid #333;
    box-shadow: -5px 0 15px rgba(0,0,0,0.5);
    transition: 0.3s ease-in-out;
    z-index: 1001;
    padding: 25px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow-y: auto;
    color: white;
    font-family: Arial, sans-serif;
}

.painel-config.aberto {
    right: 0; 
}

.painel-config h2 {
    border-bottom: 1px solid #333;
    padding-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 20px;
}

.btn-fechar {
    background: none;
    border: none;
    color: #ff4444;
    font-size: 20px;
    cursor: pointer;
}

.secao-config {
    background: #252525;
    padding: 15px;
    border-radius: 8px;
    border: 1px solid #333;
}

.secao-config h3 {
    font-size: 14px;
    color: #4CAF50;
    margin-bottom: 10px;
    text-transform: uppercase;
}

.secao-config label {
    display: block;
    font-size: 13px;
    margin-top: 8px;
    margin-bottom: 4px;
}

.secao-config input[type="number"], 
.secao-config input[type="text"],
.secao-config select {
    width: 100%;
    background: #121212;
    border: 1px solid #444;
    color: white;
    padding: 8px;
    border-radius: 6px;
    margin-bottom: 10px;
    box-sizing: border-box;
}

.btn-salvar {
    background: #4CAF50;
    color: white;
    width: 100%;
    border: none;
    padding: 10px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}

.btn-upload {
    background: #0094ff;
    color: white;
    width: 100%;
    border: none;
    padding: 10px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 5px;
}

</style>

</head>

<body>

<div class="sidebar">
    <div class="sidebar-topo">
        <h2>Arquivos</h2>
        <div id="arquivos">
            Carregando...
        </div>
    </div>
    <button class="format" onclick="formatarSPIFFS()">
        Formatar SPIFFS
    </button>
</div>

<div class="main">
    <button class="btn-config" onclick="togglePainelConfig(true)">☰</button>

    <div class="topo">
        <div class="titulo">
            <h1>Monitor ESP32</h1>
            <div class="statusLinha">
                <div id="wifiStatus" class="status offline">🔴 Wi-Fi</div>
                <div id="wsStatus" class="status offline">🔴 WebSocket</div>
                <div id="recStatus" class="status">⚪ Parado</div>
            </div>
            <div id="valores">
                V: --- | I: --- | P: --- | S: --- | FP: ---
            </div>
        </div>

        <div class="infoSuperior">
            <div id="relogio">
                --/--/----<br>--:--:--
            </div>
            <br>
            <div id="spiffs">
                SPIFFS<br>---
            </div>
            <br>
            <div id="fpContainer">
                FP Instantâneo<br><span id="fpValor">---</span>
            </div>
        </div>
    </div>

    <div class="controles">
        <button id="recBtn" class="start" onclick="toggleRec()">
            Iniciar Gravação
        </button>

        <label>Modo</label>
        <select id="modoVisualizacao">
            <option value="1">Gráfico Único</option>
            <option value="2">Empilhados</option>
            <option value="3">2 x 2</option>
            <option value="4">Lado a lado</option>
        </select>

        <label>Pontos</label>
        <select id="maxPontos">
            <option value="30">30</option>
            <option value="50">50</option>
            <option value="100" selected>100</option>
            <option value="200">200</option>
            <option value="500">500</option>
        </select>

        <button class="clear" onclick="limparGraficos()">
            🗑 Limpar
        </button>
    </div>

    <div id="graficos">
        <div id="modo1" class="modo-wrapper">
            <div class="chart-container">
                <canvas id="graficoPrincipal"></canvas>
            </div>
        </div>

        <div id="modo2" class="modo-wrapper">
            <div class="chart-container"><canvas id="graficoPotencia"></canvas></div>
            <div class="chart-container"><canvas id="graficoPotenciaAparente"></canvas></div>
            <div class="chart-container"><canvas id="graficoCorrente"></canvas></div>
            <div class="chart-container"><canvas id="graficoTensao"></canvas></div>
        </div>

        <div id="modo3" class="modo-wrapper">
            <div class="chart-container"><canvas id="graficoTensao2"></canvas></div>
            <div class="chart-container"><canvas id="graficoCorrente2"></canvas></div>
            <div class="chart-container"><canvas id="graficoPotencia2"></canvas></div>
            <div class="chart-container"><canvas id="graficoPotenciaAparente2"></canvas></div>
        </div>

        <div id="modo4" class="modo-wrapper">
            <div class="chart-container"><canvas id="graficoTensao3"></canvas></div>
            <div class="chart-container"><canvas id="graficoCorrente3"></canvas></div>
            <div class="chart-container"><canvas id="graficoPotencia3"></canvas></div>
            <div class="chart-container"><canvas id="graficoPotenciaAparente3"></canvas></div>
        </div>
    </div>

</div>

<!-- PAINEL DE CONFIGURAÇÕES FLUTUANTE -->
<div id="painelConfig" class="painel-config">
    <h2>Configurações <button class="btn-fechar" onclick="togglePainelConfig(false)">✕</button></h2>
    
    <div class="secao-config">
        <h3>Upload Remoto HTML</h3>
        <label>Selecionar arquivo (.htm / .html):</label>
        <input type="file" id="arquivoHtmlInput" accept=".htm,.html">
        <button class="btn-upload" onclick="fazerUploadHtml()">Enviar Arquivo</button>
        
        <label>HTML Padrão de Leitura:</label>
        <input type="text" id="htmlPadraoNome" value="jarvis.htm" placeholder="Ex: jarvis.htm">
        <button class="btn-salvar" onclick="salvarNomeHtmlPadrao()">Definir Padrão</button>
    </div>

    <div class="secao-config">
        <h3>Calibração (CAL)</h3>
        <label>Valor de CAL (0 a 3):</label>
        <select id="calValor">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
        </select>
        <button class="btn-salvar" onclick="salvarCalibracao()">Executar Ajuste (Setup)</button>
    </div>

    <div class="secao-config">
        <h3>Fatores de Correção</h3>
        
        <h4>Ajustes de Tensão (V)</h4>
        <label>Coeficiente A (Ganho):</label>
        <input type="number" id="coefA_VAC_Input" step="0.00001">
        
        <label>Coeficiente B (Offset):</label>
        <input type="number" id="coefB_VAC_Input" step="0.00001">
        
        <hr style="border: 0; border-top: 1px solid #ccc; margin: 15px 0;">
        
        <h4>Ajustes de Corrente (I)</h4>
        <label>Coeficiente A (Ganho):</label>
        <input type="number" id="coefA_IAC_Input" step="0.00001">
        
        <label>Coeficiente B (Offset):</label>
        <input type="number" id="coefB_IAC_Input" step="0.00001">
        
        <button class="btn-salvar" onclick="salvarFatoresCorrecao()">Salvar Coeficientes</button>
    </div>
</div>

<script>

/*==========================================================
    VARIÁVEIS GLOBAIS
==========================================================*/

let ws;
let gravando=false;
let wsConectado=false; 

let graficoPrincipal=null;

let graficoPotencia=null;
let graficoPotenciaAparente=null;
let graficoCorrente=null;
let graficoTensao=null;

let graficoPotencia2=null;
let graficoPotenciaAparente2=null;
let graficoCorrente2=null;
let graficoTensao2=null;

let graficoPotencia3=null;
let graficoPotenciaAparente3=null;
let graficoCorrente3=null;
let graficoTensao3=null;

let modoAtual=1;
let limitePontos=100;

/*==========================================================
    CONTROLE DO PAINEL FLUTUANTE 
==========================================================*/

function togglePainelConfig(abrir) {
    const painel = document.getElementById("painelConfig");
    if (abrir) {
        painel.classList.add("aberto");
        if(wsConectado) carregarValoresConfig();
    } else {
        painel.classList.remove("aberto");
    }
}

/*==========================================================
    REQUISIÇÕES DE CONFIGURAÇÃO PARA O ESP32 
==========================================================*/
function getBaseUrl() {
    if (location.hostname.includes("github.io") || !location.hostname) {
        return "http://green.local";
    }
    return "";
}
function carregarValoresConfig() {
    fetch(getBaseUrl() + "/getConfig")
    .then(r => r.json())
    .then(data => {
        document.getElementById("htmlPadraoNome").value = data.htmlPadrao || "jarvis.htm";
        document.getElementById("calValor").value = data.cal !== undefined ? data.cal : 0;
        
        document.getElementById("coefA_VAC_Input").value = data.coefA_VAC !== undefined ? data.coefA_VAC : 1.0;
        document.getElementById("coefB_VAC_Input").value = data.coefB_VAC !== undefined ? data.coefB_VAC : 0.0;
        document.getElementById("coefA_IAC_Input").value = data.coefA_IAC !== undefined ? data.coefA_IAC : 1.0;
        document.getElementById("coefB_IAC_Input").value = data.coefB_IAC !== undefined ? data.coefB_IAC : 0.0;
    }).catch(e => console.log("Erro ao carregar configurações do ESP"));
}

function fazerUploadHtml() {
    const input = document.getElementById("arquivoHtmlInput");
    if(input.files.length === 0) {
        alert("Selecione um arquivo primeiro!");
        return;
    }
    let arquivo = input.files[0];
    let formData = new FormData();
    formData.append("data", arquivo, "/" + arquivo.name);

    alert("Enviando arquivo remoto... Aguarde confirmação.");
    fetch("/upload", { method: "POST", body: formData })
    .then(r => r.text())
    .then(txt => {
        alert("Upload concluído: " + txt);
        atualizarArquivos();
    }).catch(e => alert("Falha no upload do arquivo"));
}

function salvarNomeHtmlPadrao() {
    const nome = document.getElementById("htmlPadraoNome").value;
    if(!nome) return;
    fetch(`/setHtmlPadrao?nome=${nome}`)
    .then(r => r.text())
    .then(alert);
}

function salvarCalibracao() {
    const cal = document.getElementById("calValor").value;
    fetch(`/setCal?valor=${cal}`)
    .then(r => r.text())
    .then(alert);
}

function salvarFatoresCorrecao() {
    const a_vac = document.getElementById("coefA_VAC_Input").value;
    const b_vac = document.getElementById("coefB_VAC_Input").value;
    const a_iac = document.getElementById("coefA_IAC_Input").value;
    const b_iac = document.getElementById("coefB_IAC_Input").value;
    
    fetch(`/setCorrecao?a_vac=${a_vac}&b_vac=${b_vac}&a_iac=${a_iac}&b_iac=${b_iac}`)
    .then(r => r.text())
    .then(alert);
}

/*==========================================================
    DADOS DOS GRÁFICOS
==========================================================*/

let dadosGrafico={
    labels:[],
    tensao:[],
    corrente:[],
    potencia:[],
    potenciaAparente:[]
};

/*==========================================================
    LIMPAR TODOS OS GRÁFICOS
==========================================================*/

function limparGraficos(){
    dadosGrafico.labels.length = 0;
    dadosGrafico.tensao.length = 0;
    dadosGrafico.corrente.length = 0;
    dadosGrafico.potencia.length = 0;
    dadosGrafico.potenciaAparente.length = 0;

    const limparInstancia = (chart) => {
        if (chart) {
            chart.data.labels = dadosGrafico.labels;
            chart.data.datasets.forEach((dataset, index) => {
                if(chart === graficoPrincipal) {
                    if(index === 0) dataset.data = dadosGrafico.potencia;
                    if(index === 1) dataset.data = dadosGrafico.potenciaAparente;
                    if(index === 2) dataset.data = dadosGrafico.corrente;
                    if(index === 3) dataset.data = dadosGrafico.tensao;
                } else {
                    dataset.data = chart.data.datasets[0].data; 
                }
            });
            chart.update('none'); 
        }
    };

    limparInstancia(graficoPrincipal);
    limparInstancia(graficoPotencia);
    limparInstancia(graficoPotenciaAparente);
    limparInstancia(graficoCorrente);
    limparInstancia(graficoTensao);
    limparInstancia(graficoPotencia2);
    limparInstancia(graficoPotenciaAparente2);
    limparInstancia(graficoCorrente2);
    limparInstancia(graficoTensao2);
    limparInstancia(graficoPotencia3);
    limparInstancia(graficoPotenciaAparente3);
    limparInstancia(graficoCorrente3);
    limparInstancia(graficoTensao3);
}

/*==========================================================
    ALTERAÇÃO DO NÚMERO DE PONTOS
==========================================================*/

document.getElementById("maxPontos").addEventListener("change",function(){
    limitePontos=parseInt(this.value);
    cortarExcessoPontos();
    atualizarGraficos();
});

function cortarExcessoPontos() {
    while(dadosGrafico.labels.length > limitePontos){
        dadosGrafico.labels.shift();
        dadosGrafico.tensao.shift();
        dadosGrafico.corrente.shift();
        dadosGrafico.potencia.shift();
        dadosGrafico.potenciaAparente.shift();
    }
}

/*==========================================================
    ALTERAÇÃO DO MODO
==========================================================*/

document.getElementById("modoVisualizacao").addEventListener("change",function(){
    modoAtual=parseInt(this.value);
    mostrarModo(modoAtual);
});

/*==========================================================
    MOSTRAR MODO
==========================================================*/

function mostrarModo(modo){
    document.querySelectorAll('.modo-wrapper').forEach(el => {
        el.style.display = "none";
    });

    destruirGraficos();

    if(modo==1){
        document.getElementById("modo1").style.display="block";
        criarModo1();
    }
    if(modo==2){
        document.getElementById("modo2").style.display="grid";
        criarModo2();
    }
    if(modo==3){
        document.getElementById("modo3").style.display="grid";
        criarModo3();
    }
    if(modo==4){
        document.getElementById("modo4").style.display="grid";
        criarModo4();
    }
    
    atualizarGraficos();
}

/*==========================================================
    DESTRUIR TODOS OS CHARTS
==========================================================*/

function destruirGraficos(){
    if(graficoPrincipal){ graficoPrincipal.destroy(); graficoPrincipal=null; }
    if(graficoPotencia){ graficoPotencia.destroy(); graficoPotencia=null; }
    if(graficoPotenciaAparente){ graficoPotenciaAparente.destroy(); graficoPotenciaAparente=null; }
    if(graficoCorrente){ graficoCorrente.destroy(); graficoCorrente=null; }
    if(graficoTensao){ graficoTensao.destroy(); graficoTensao=null; }
    if(graficoPotencia2){ graficoPotencia2.destroy(); graficoPotencia2=null; }
    if(graficoPotenciaAparente2){ graficoPotenciaAparente2.destroy(); graficoPotenciaAparente2=null; }
    if(graficoCorrente2){ graficoCorrente2.destroy(); graficoCorrente2=null; }
    if(graficoTensao2){ graficoTensao2.destroy(); graficoTensao2=null; }
    if(graficoPotencia3){ graficoPotencia3.destroy(); graficoPotencia3=null; }
    if(graficoPotenciaAparente3){ graficoPotenciaAparente3.destroy(); graficoPotenciaAparente3=null; }
    if(graficoCorrente3){ graficoCorrente3.destroy(); graficoCorrente3=null; }
    if(graficoTensao3){ graficoTensao3.destroy(); graficoTensao3=null; }
}

/*==========================================================
    CRIAÇÃO DOS GRÁFICOS
==========================================================*/

function configuracaoGrafico(titulo, dados, cor){
    return{
        type:'line',
        data:{
            labels:dadosGrafico.labels,
            datasets:[{
                label:titulo,
                data:dados,
                borderColor:cor,
                backgroundColor:cor,
                borderWidth:2,
                pointRadius:0,
                tension:0.15,
                fill:false
            }]
        },
        options:{
            responsive:true,
            maintainAspectRatio:false,
            animation:false,
            elements: {
                line: {
                    decimation: {enabled: true, algorithm: 'lttb'} 
                }
            },
            interaction:{
                intersect:false,
                mode:'index'
            },
            plugins:{
                legend:{
                    display:true,
                    labels: { boxWidth: 12 }
                }
            },
            scales:{
                x:{
                    display:true,
                    grid: { color: 'rgba(255,255,255,0.05)' }
                },
                y:{
                    beginAtZero:false,

function adicionarPonto(v, i, p, S){
    let agora=new Date();
    let horario=
        agora.getHours().toString().padStart(2,'0')+":"
       +agora.getMinutes().toString().padStart(2,'0')+":"
       +agora.getSeconds().toString().padStart(2,'0');

    dadosGrafico.labels.push(horario);
    dadosGrafico.tensao.push(v);
    dadosGrafico.corrente.push(i);
    dadosGrafico.potencia.push(p);
    dadosGrafico.potenciaAparente.push(S);

    cortarExcessoPontos();
    atualizarGraficos();
}

function conectarWS(){
    // Se o site for acessado no GitHub Pages ou outro domínio, conecta via mDNS (green.local:81)
    // Se for acessado direto pelo IP/hostname local do ESP32, usa o endereço atual
    let hostWs = location.hostname ? location.hostname : "green.local";
    if (hostWs.includes("github.io") || hostWs === "") {
        hostWs = "green.local";
    }

    ws = new WebSocket("ws://" + hostWs + ":81/");

    ws.onopen = function(){
        wsConectado = true;
        document.getElementById("wsStatus").innerHTML = "🟢 WebSocket";
        document.getElementById("wsStatus").className = "status online";
        document.getElementById("wifiStatus").innerHTML = "🟢 Wi-Fi";
        document.getElementById("wifiStatus").className = "status online";
        atualizarStatus();
        atualizarSPIFFS();
        atualizarArquivos();
    };

    ws.onclose = function(){
        wsConectado = false;
        document.getElementById("wsStatus").innerHTML = "🔴 WebSocket";
        document.getElementById("wsStatus").className = "status offline";
        document.getElementById("wifiStatus").innerHTML = "🔴 Wi-Fi";
        document.getElementById("wifiStatus").className = "status offline";
        setTimeout(conectarWS, 1000);
    };

    ws.onerror = function(){
        ws.close();
    };

    ws.onmessage = function(event){
        try {
            let obj = JSON.parse(event.data);
            let V = parseFloat(obj.tensao);
            let I = parseFloat(obj.corrente);
            let P = parseFloat(obj.potencia);
            let S = parseFloat(obj.potenciaAparente);
            let FP = parseFloat(obj.fp);

            document.getElementById("valores").innerHTML =
                "V: " + V.toFixed(2) + " V | I: " + I.toFixed(2) + " A | P: " + P.toFixed(2) + " W | S: " + S.toFixed(2) + " VA | FP: " + FP.toFixed(3);

            document.getElementById("fpValor").innerText = FP.toFixed(3);

            adicionarPonto(V, I, P, S);
        } catch(e) {
            console.error("Erro ao processar dados WS:", e);
        }
    };
}

mostrarModo(1);

function toggleRec(){
    if(!wsConectado) return; 
    
    if(!gravando){
        fetch("/start")
        .then(r=>r.text())
        .then(function(){
            gravando=true;
            document.getElementById("recBtn").innerHTML="Parar Gravação";
            document.getElementById("recBtn").className="stop";
            document.getElementById("recStatus").innerHTML="🔴 REC";
            document.getElementById("recStatus").className="status rec";
            atualizarArquivos();
        }).catch(err => console.log("Erro ao iniciar gravação"));
    }
    else{
        fetch("/stop")
        .then(r=>r.text())
        .then(function(){
            gravando=false;
            document.getElementById("recBtn").innerHTML="Iniciar Gravação";
            document.getElementById("recBtn").className="start";
            document.getElementById("recStatus").innerHTML="⚪ Parado";
            document.getElementById("recStatus").className="status";
            atualizarArquivos();
        }).catch(err => console.log("Erro ao parar gravação"));
    }
}

function formatarSPIFFS(){
    if(!wsConectado) return;
    if(!confirm("Deseja realmente formatar o SPIFFS?")) return;
    fetch("/formatar").then(r=>r.text()).then(alert);
}

function atualizarArquivos(){
    if(!wsConectado) return; 
    fetch("/folder?name=/")
    .then(r=>r.text())
    .then(function(html){
        document.getElementById("arquivos").innerHTML=html;
    }).catch(err => {});
}

function atualizarRelogio(){
    let agora=new Date();
    let data=agora.toLocaleDateString();
    let hora=agora.toLocaleTimeString();
    document.getElementById("relogio").innerHTML=data+"<br>"+hora;
}

setInterval(atualizarRelogio,1000);
atualizarRelogio();

function atualizarStatus(){
    if(!wsConectado) return; 
    
    fetch("/status")
    .then(r=>r.json())
    .then(function(obj){
        if(obj.wifi){
            document.getElementById("wifiStatus").innerHTML="🟢 Wi-Fi";
            document.getElementById("wifiStatus").className="status online";
        } else {
            document.getElementById("wifiStatus").innerHTML="🔴 Wi-Fi";
            document.getElementById("wifiStatus").className="status offline";
        }
    })
    .catch(function(){
        if (wsConectado) {
            document.getElementById("wifiStatus").innerHTML="🟢 Wi-Fi";
            document.getElementById("wifiStatus").className="status online";
        } else {
            document.getElementById("wifiStatus").innerHTML="🔴 Wi-Fi";
            document.getElementById("wifiStatus").className="status offline";
        }
    });
}

function atualizarSPIFFS(){
    if(!wsConectado) return; 
    fetch("/spiffs")
    .then(r=>r.json())
    .then(function(obj){
        document.getElementById("spiffs").innerHTML= "SPIFFS<br>"+obj.livre.toFixed(2)+" MB livres";
    }).catch(err => {});
}

setInterval(atualizarStatus,3000);
setInterval(atualizarSPIFFS,5000);
